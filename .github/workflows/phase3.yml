name: Phase 3 corpus validation, scanner evaluation, and review queues

on:
  push:
    branches:
      - research/phase3-empirical-evaluation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate pinned corpus and create inventory
        run: python scripts/validate_corpus.py

      - name: Generate conservative review candidates
        run: python scripts/scan_candidates.py corpus/rendered --output results/raw_candidate_findings.jsonl

      - name: Build resource-level eligibility review queue
        run: python scripts/build_workload_inventory.py --out-dir results/ci-generated

      - name: Evaluate against pre-adjudication author-validated labels
        run: |
          python scripts/evaluate_scanner.py \
            --labels results/labels/reviewer_AI1_full.csv \
            --candidates results/raw_candidate_findings.jsonl \
            --inventory results/corpus_inventory.jsonl \
            --output-dir results/ci-analysis/pre-adjudication

      - name: Evaluate against frozen author-adjudicated labels
        run: |
          python scripts/evaluate_scanner.py \
            --labels results/labels/reference_labels_author_validated_v1.csv \
            --candidates results/raw_candidate_findings.jsonl \
            --inventory results/corpus_inventory.jsonl \
            --output-dir results/ci-analysis/post-adjudication

      - name: Project-cluster bootstrap and influence analysis
        run: |
          python scripts/cluster_bootstrap.py \
            --project-prevalence results/ci-analysis/pre-adjudication/project_rule_prevalence.csv \
            --project-metrics results/ci-analysis/pre-adjudication/project_scanner_metrics.csv \
            --output-dir results/ci-analysis/pre-adjudication/cluster-analysis
          python scripts/cluster_bootstrap.py \
            --project-prevalence results/ci-analysis/post-adjudication/project_rule_prevalence.csv \
            --project-metrics results/ci-analysis/post-adjudication/project_scanner_metrics.csv \
            --output-dir results/ci-analysis/post-adjudication/cluster-analysis

      - name: Upload reproducible outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase3-scanner-evaluation-and-review-queues
          path: |
            results/corpus_inventory.jsonl
            results/corpus_validation.json
            results/raw_candidate_findings.jsonl
            results/ci-generated/resource_eligibility_review.csv
            results/ci-generated/bundle_eligibility_review.csv
            results/ci-generated/workload_inventory_summary.json
            results/ci-analysis/pre-adjudication/scanner_metrics.csv
            results/ci-analysis/post-adjudication/scanner_metrics.csv
            results/ci-analysis/pre-adjudication/rule_prevalence.csv
            results/ci-analysis/post-adjudication/rule_prevalence.csv
            results/ci-analysis/pre-adjudication/project_rule_prevalence.csv
            results/ci-analysis/post-adjudication/project_rule_prevalence.csv
            results/ci-analysis/pre-adjudication/project_scanner_metrics.csv
            results/ci-analysis/post-adjudication/project_scanner_metrics.csv
            results/ci-analysis/pre-adjudication/scanner_disagreements.csv
            results/ci-analysis/post-adjudication/scanner_disagreements.csv
            results/ci-analysis/pre-adjudication/evaluation_summary.json
            results/ci-analysis/post-adjudication/evaluation_summary.json
            results/ci-analysis/pre-adjudication/cluster-analysis/*
            results/ci-analysis/post-adjudication/cluster-analysis/*
          if-no-files-found: error
          retention-days: 30
