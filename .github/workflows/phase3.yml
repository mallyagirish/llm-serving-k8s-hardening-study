name: Phase 3 corpus validation and candidate scan

on:
  push:
    branches:
      - research/phase3-empirical-evaluation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate pinned corpus and create inventory
        run: python scripts/validate_corpus.py

      - name: Generate conservative review candidates
        run: python scripts/scan_candidates.py corpus/rendered --output results/raw_candidate_findings.jsonl

      - name: Upload reproducible outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase3-corpus-validation-and-candidates
          path: |
            results/corpus_inventory.jsonl
            results/corpus_validation.json
            results/raw_candidate_findings.jsonl
          if-no-files-found: error
          retention-days: 30
