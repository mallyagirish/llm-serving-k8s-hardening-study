apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scan-litellm-postgresql
  namespace: "llm-scan"
  labels:
    app.kubernetes.io/instance: scan-litellm
    app.kubernetes.io/managed-by: Helm
