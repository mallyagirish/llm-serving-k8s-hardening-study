          securityContext:
            {}
          image: "ghcr.io/berriai/litellm:v1.85.1"
          imagePullPolicy: Always
          env:
            
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scan-litellm-dbcredentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scan-litellm-dbcredentials
                  key: password
            - name: DATABASE_HOST
              value: scan-litellm-postgresql
            - name: DATABASE_NAME
              value: litellm
            - name: PROXY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: scan-litellm-masterkey
                  key: masterkey
            - name: LITELLM_LOG
              value: "INFO"
            # Schema updates are owned by the dedicated migrations Job; skip
            # the proxy's startup `prisma db push` so N replicas don't race
            # one DB on every rollout. Placed last (after envVars and
