kind: Job
metadata:
  name: scan-litellm-migrations
  labels:
    helm.sh/chart: litellm-helm-1.1.3
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: scan-litellm
    app.kubernetes.io/version: "v1.85.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    checksum/config: a118327502a4792e3afcaa6d3f8f879b12211871800d1223d40e9455ca3e300c
spec:
  template:
    metadata:
      labels:
        helm.sh/chart: litellm-helm-1.1.3
        app.kubernetes.io/name: litellm
        app.kubernetes.io/instance: scan-litellm
        app.kubernetes.io/version: "v1.85.1"
        app.kubernetes.io/managed-by: Helm
      annotations:
    spec:
      serviceAccountName: default
      securityContext:
        {} 
      containers:
        - name: prisma-migrations
          image: "ghcr.io/berriai/litellm:v1.85.1"
          imagePullPolicy: Always
          securityContext:
            {}
          command: ["python", "litellm/proxy/prisma_migration.py"]
          workingDir: "/app"
          env:
            - name: DATABASE_URL
              value: postgresql://litellm:NoTaGrEaTpAsSwOrD@scan-litellm-postgresql/litellm
            - name: DISABLE_SCHEMA_UPDATE
              value: "false" # always run the migration from the Helm PreSync hook, override the value set
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 120
  backoffLimit: 4
  activeDeadlineSeconds: 1800
