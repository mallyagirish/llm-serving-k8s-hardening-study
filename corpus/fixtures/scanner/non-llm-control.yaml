apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordinary-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordinary-web
  template:
    metadata:
      labels:
        app: ordinary-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
