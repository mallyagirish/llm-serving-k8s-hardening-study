# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-25-v100-single-gpu-qwen05b-deployment-vllm"
  namespace: llm-scan
  labels:
    model: qwen05b
    helm-release-name: scan-values-25-v100-single-gpu
    app.kubernetes.io/name: qwen05b
    app.kubernetes.io/instance: scan-values-25-v100-single-gpu
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      model: qwen05b
      helm-release-name: scan-values-25-v100-single-gpu
      app.kubernetes.io/name: qwen05b
      app.kubernetes.io/instance: scan-values-25-v100-single-gpu
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: qwen05b
        helm-release-name: scan-values-25-v100-single-gpu
        app.kubernetes.io/name: qwen05b
        app.kubernetes.io/instance: scan-values-25-v100-single-gpu
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostname: "scan-values-25-v100-single-gpu-qwen05b-vllm-stack"
      subdomain: "scan-values-25-v100-single-gpu-qwen05b-engine-service"
      containers:
        - name: "vllm"
          image: "vllm/vllm-openai:v0.8.5"
          securityContext:
            runAsNonRoot: false
          command:
          - "vllm"
          - "serve"
          - "Qwen/Qwen2.5-0.5B-Instruct"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--no-enable-prefix-caching"
          - "--max-model-len"
          - "16384"
          - "--dtype"
          - "half"
          - "--tensor-parallel-size"
          - "1"
          - "--gpu_memory_utilization"
          - "0.9"
          - "--enforce-eager"
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /data
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_USE_V1
            value: "0"
          - name: VLLM_ENABLE_CUDA_COMPATIBILITY
            value: "1"
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "16Gi"
              cpu: "6"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: scan-values-25-v100-single-gpu-storage
            mountPath: /data
          - name: shm
            mountPath: /dev/shm
      volumes:
        - name: scan-values-25-v100-single-gpu-storage
          persistentVolumeClaim:
            claimName: "scan-values-25-v100-single-gpu-qwen05b-storage-claim"
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - gpu-node-01
