# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-09-lora-operator-llama3-8b-instr-deployment-vllm"
  namespace: llm-scan
  labels:
    model: llama3-8b-instr
    helm-release-name: scan-values-09-lora-operator
    app.kubernetes.io/name: llama3-8b-instr
    app.kubernetes.io/instance: scan-values-09-lora-operator
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      model: llama3-8b-instr
      helm-release-name: scan-values-09-lora-operator
      app.kubernetes.io/name: llama3-8b-instr
      app.kubernetes.io/instance: scan-values-09-lora-operator
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: llama3-8b-instr
        helm-release-name: scan-values-09-lora-operator
        app.kubernetes.io/name: llama3-8b-instr
        app.kubernetes.io/instance: scan-values-09-lora-operator
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostname: "scan-values-09-lora-operator-llama3-8b-instr-vllm-stack"
      subdomain: "scan-values-09-lora-operator-llama3-8b-instr-engine-service"
      containers:
        - name: "vllm"
          image: "vllm/vllm-openai:latest"
          securityContext:
            runAsNonRoot: false
          command:
          - "vllm"
          - "serve"
          - "meta-llama/Llama-3.1-8B-Instruct"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--enable-lora"
          - "--no-enable-prefix-caching"
          - "--max-model-len"
          - "4096"
          - "--dtype"
          - "bfloat16"
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /data
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PROMETHEUS_MULTIPROC_DIR
            value: "/tmp"
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-credentials
                key: HUGGING_FACE_HUB_TOKEN
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                key: HUGGING_FACE_HUB_TOKEN
                name: huggingface-credentials
          - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
            value: "True"
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 120
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: scan-values-09-lora-operator-storage
            mountPath: /data
        - name: sidecar
          image: lmcache/lmstack-sidecar:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "30090"
            - name: LORA_DOWNLOAD_BASE_DIR
              value: /data/lora-adapters
          volumeMounts:
            - name: scan-values-09-lora-operator-storage
              mountPath: /data
      volumes:
        - name: scan-values-09-lora-operator-storage
          persistentVolumeClaim:
            claimName: "scan-values-09-lora-operator-llama3-8b-instr-storage-claim"
