# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-01-minimal-amd-example-opt125m-deployment-vllm"
  namespace: llm-scan
  labels:
    model: opt125m
    helm-release-name: scan-values-01-minimal-amd-example
    app.kubernetes.io/name: opt125m
    app.kubernetes.io/instance: scan-values-01-minimal-amd-example
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      model: opt125m
      helm-release-name: scan-values-01-minimal-amd-example
      app.kubernetes.io/name: opt125m
      app.kubernetes.io/instance: scan-values-01-minimal-amd-example
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: opt125m
        helm-release-name: scan-values-01-minimal-amd-example
        app.kubernetes.io/name: opt125m
        app.kubernetes.io/instance: scan-values-01-minimal-amd-example
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostname: "scan-values-01-minimal-amd-example-opt125m-vllm-stack"
      subdomain: "scan-values-01-minimal-amd-example-opt125m-engine-service"
      containers:
        - name: "vllm"
          image: "rocm/vllm:instinct_main"
          securityContext:
            runAsNonRoot: false
          command:
          - "vllm"
          - "serve"
          - "facebook/opt-125m"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /tmp
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: scan-values-01-minimal-amd-example-secrets
                key: hf_token_opt125m
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "16Gi"
              cpu: "6"
              amd.com/gpu: "1"
            limits:
              amd.com/gpu: "1"
      tolerations:
        - effect: NoSchedule
          key: your-node-taint
          operator: Equal
          value: your-node-taint-value
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: your-node-label
                operator: In
                values:
                - your-node-label-value
