# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-16-disagg-prefill-llama-prefill-deployment-vllm"
  namespace: llm-scan
  labels:
    model: llama-prefill
    helm-release-name: scan-values-16-disagg-prefill
    app.kubernetes.io/name: llama-prefill
    app.kubernetes.io/instance: scan-values-16-disagg-prefill
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
    model: llama-prefill
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      model: llama-prefill
      helm-release-name: scan-values-16-disagg-prefill
      app.kubernetes.io/name: llama-prefill
      app.kubernetes.io/instance: scan-values-16-disagg-prefill
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: llama-prefill
        helm-release-name: scan-values-16-disagg-prefill
        app.kubernetes.io/name: llama-prefill
        app.kubernetes.io/instance: scan-values-16-disagg-prefill
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostIPC: true
      hostPID: true
      hostname: "scan-values-16-disagg-prefill-llama-prefill-vllm-stack"
      subdomain: "scan-values-16-disagg-prefill-llama-prefill-engine-service"
      containers:
        - name: "vllm"
          image: "lmcache/vllm-openai:2025-05-27-v1"
          securityContext:
            capabilities:
              add:
              - SYS_PTRACE
            runAsNonRoot: false
          command:
          - "/opt/venv/bin/vllm"
          - "serve"
          - "meta-llama/Llama-3.1-8B-Instruct"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--enable-prefix-caching"
          - "--max-model-len"
          - "32000"
          - "--kv-transfer-config"
          - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_producer","kv_connector_extra_config":{"discard_partial_chunks": false, "lmcache_rpc_port": "sender"}}'
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /data
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PROMETHEUS_MULTIPROC_DIR
            value: "/tmp"
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: scan-values-16-disagg-prefill-secrets
                key: hf_token_llama-prefill
          - name: LMCACHE_USE_EXPERIMENTAL
            value: "True"
          - name: VLLM_RPC_TIMEOUT
            value: "1000000"
          - name: LMCACHE_LOG_LEVEL
            value: "INFO"
          - name: CUDA_VISIBLE_DEVICES
            value: "0"
          - name: LMCACHE_LOCAL_CPU
            value: "False"
          - name: LMCACHE_MAX_LOCAL_CPU_SIZE
            value: "0"
          - name: LMCACHE_REMOTE_SERDE
            value: "NULL"
          - name: UCX_TLS
            value: "cuda_ipc,cuda_copy,tcp"
          - name: LMCACHE_ENABLE_NIXL
            value: "True"
          - name: LMCACHE_NIXL_ROLE
            value: "sender"
          - name: LMCACHE_NIXL_RECEIVER_HOST
            # value:  "0.0.0.0"
            value: "pd-llama-decode-engine-service"
          - name: LMCACHE_NIXL_RECEIVER_PORT
            value: "55555"
          - name: LMCACHE_NIXL_BUFFER_SIZE
            value: "1073741824"
          - name: LMCACHE_NIXL_BUFFER_DEVICE
            value: "cuda"
          - name: LMCACHE_NIXL_ENABLE_GC
            value: "True"
          - name: LMCACHE_LMCACHE_INSTANCE_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "30Gi"
              cpu: "8"
            limits:
          volumeMounts:
          - name: scan-values-16-disagg-prefill-storage
            mountPath: /data
      volumes:
        - name: scan-values-16-disagg-prefill-storage
          persistentVolumeClaim:
            claimName: "scan-values-16-disagg-prefill-llama-prefill-storage-claim"
---
