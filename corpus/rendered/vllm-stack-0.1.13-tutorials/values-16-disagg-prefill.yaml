# Source: vllm-stack/templates/deployment-router.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-16-disagg-prefill-deployment-router"
  namespace: llm-scan
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/instance: scan-values-16-disagg-prefill
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: router
    release: router
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: router
      app.kubernetes.io/instance: scan-values-16-disagg-prefill
      app.kubernetes.io/component: router
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: router
      release: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
        app.kubernetes.io/instance: scan-values-16-disagg-prefill
        app.kubernetes.io/component: router
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: router
        release: router
    spec:
      serviceAccountName: scan-values-16-disagg-prefill-router-service-account
      containers:
      - name: router-container
        image: "lmcache/lmstack-router:pd"
        imagePullPolicy: "Always"
        env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: LMCACHE_LOG_LEVEL
            value: "INFO"
        args:
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--service-discovery"
          - "k8s"
          - "--k8s-namespace"
          - "llm-scan"
          - "--k8s-service-discovery-type"
          - "pod-ip"
          - "--k8s-label-selector"
          - environment=test,release=test
          - "--routing-logic"
          - "disaggregated_prefill"
          - "--engine-stats-interval"
          - "15"
          - "--request-stats-window"
          - "60"
          - --prefill-model-labels
          - llama-prefill
          - --decode-model-labels
          - llama-decode
        resources:
          limits:
            cpu: "4"
            memory: 32G
          requests:
            cpu: "4"
            memory: 16G
        ports:
          - name: "router-port"
            containerPort: 8000
          - name: "lmcache-port"
            containerPort: 9000
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: router-port
          initialDelaySeconds: 30
          periodSeconds: 5
        startupProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: router-port
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: router-port
          initialDelaySeconds: 30
          periodSeconds: 5
