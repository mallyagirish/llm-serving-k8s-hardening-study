# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-13-tool-enabled-llama3-8b-deployment-vllm"
  namespace: llm-scan
  labels:
    model: llama3-8b
    helm-release-name: scan-values-13-tool-enabled
    app.kubernetes.io/name: llama3-8b
    app.kubernetes.io/instance: scan-values-13-tool-enabled
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      model: llama3-8b
      helm-release-name: scan-values-13-tool-enabled
      app.kubernetes.io/name: llama3-8b
      app.kubernetes.io/instance: scan-values-13-tool-enabled
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: llama3-8b
        helm-release-name: scan-values-13-tool-enabled
        app.kubernetes.io/name: llama3-8b
        app.kubernetes.io/instance: scan-values-13-tool-enabled
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostname: "scan-values-13-tool-enabled-llama3-8b-vllm-stack"
      subdomain: "scan-values-13-tool-enabled-llama3-8b-engine-service"
      containers:
        - name: "vllm"
          image: "vllm/vllm-openai:latest"
          securityContext:
            runAsNonRoot: false
          command:
          - "vllm"
          - "serve"
          - "meta-llama/Llama-3.1-8B-Instruct"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "llama3_json"
          - "--no-enable-prefix-caching"
          - "--max-model-len"
          - "4096"
          - "--dtype"
          - "bfloat16"
          - "--tensor-parallel-size"
          - "1"
          - "--chat-template"
          - "/templates//templates/tool_chat_template_llama3.1_json.jinja"
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /tmp
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PROMETHEUS_MULTIPROC_DIR
            value: "/tmp"
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                key: HUGGING_FACE_HUB_TOKEN
                name: huggingface-credentials
          - name: VLLM_TEMPLATE_DIR
            value: /templates
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: shm
            mountPath: /dev/shm
          - name: vllm-templates
            mountPath: /templates
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: vllm-templates
          persistentVolumeClaim:
            claimName: vllm-templates-pvc
