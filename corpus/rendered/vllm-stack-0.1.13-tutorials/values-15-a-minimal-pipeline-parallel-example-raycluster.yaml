apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: "scan-15-a-minimal-pipeline-parallel-example-r-distilgpt2-raycluster-raycluster"
  namespace: llm-scan
  labels:
    model: distilgpt2-raycluster
    helm-release-name: scan-15-a-minimal-pipeline-parallel-example-r
    environment: test
    release: test
spec:
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      metadata:
        labels:
          model: distilgpt2-raycluster
          helm-release-name: scan-15-a-minimal-pipeline-parallel-example-r
          environment: test
          release: test
      spec:
        terminationGracePeriodSeconds: 0
        containers:
          - name: vllm-ray-head
            image: "vllm/vllm-openai:v0.17.1"
            imagePullPolicy: "Always"
            command:
              - >-
                /bin/bash -c "
                cp /entrypoint/vllm-entrypoint.sh \$HOME/vllm-entrypoint.sh &&
                chmod +x \$HOME/vllm-entrypoint.sh &&
                \$HOME/vllm-entrypoint.sh &
                echo \"Running vllm command in the background.\""
            env:
              - name: VLLM_HOST_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: EXPECTED_NODES
                value: "2"
              - name: HF_HOME
                value: /tmp
              - name: VLLM_USE_V1
                value: "0"
            ports:
              - name: "container-port"
                containerPort: 8000
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 1
              periodSeconds: 10
            livenessProbe:
              exec:
                command: ["/bin/bash", "-c", "echo TBD"]
            resources:
              requests:
                memory: "20Gi"
                cpu: "1"
                nvidia.com/gpu: "1"
              limits:
                nvidia.com/gpu: "1"
            startupProbe:
              exec:
                command: ["/bin/bash", "-c", "python3 /scripts/wait_for_ray.py"]
              failureThreshold: 30
              periodSeconds: 15
              timeoutSeconds: 10
            volumeMounts:
              - name: wait-script
                mountPath: /scripts
              - name: vllm-script
                mountPath: /entrypoint
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: wait-script
            configMap:
              name: "distilgpt2-raycluster-wait-for-ray-script"
          - name: vllm-script
            configMap:
              name: "distilgpt2-raycluster-vllm-start-script"
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 20Gi
  workerGroupSpecs:
    - rayStartParams: {}
      replicas: 1
      groupName: ray
      template:
        metadata:
          labels:
            model: distilgpt2-raycluster
            helm-release-name: scan-15-a-minimal-pipeline-parallel-example-r
            environment: test
            release: test
        spec:
          containers:
            - name: vllm-ray-worker
              image: "vllm/vllm-openai:v0.17.1"
              imagePullPolicy: "Always"
              env:
                - name: VLLM_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: HF_HOME
                  value: /tmp
                - name: VLLM_USE_V1
                  value: "0"
              readinessProbe:
                exec:
                  command: ["/bin/bash", "-c", "echo TBD"]
              livenessProbe:
                exec:
                  command: ["/bin/bash", "-c", "echo TBD"]
              resources:
                requests:
                  memory: "20Gi"
                  cpu: "1"
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
              - name: shm
                mountPath: /dev/shm
          volumes:
            - name: wait-script
              configMap:
                name: "distilgpt2-raycluster-wait-for-ray-script"
            - name: vllm-script
              configMap:
                name: "distilgpt2-raycluster-vllm-start-script"
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 20Gi
