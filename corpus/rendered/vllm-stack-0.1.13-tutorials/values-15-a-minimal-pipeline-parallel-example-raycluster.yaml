# Source: vllm-stack/templates/ray-cluster.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "distilgpt2-raycluster-wait-for-ray-script"
data:
  wait_for_ray.py: |
    import ray
    import logging
    import os
    import sys

    logging.basicConfig(level=logging.INFO, format='[%(asctime)s] %(message)s')

    try:
        ray.init(address="auto")
    except Exception as e:
        logging.error(f"Failed to initialize Ray: {e}")
        sys.exit(1)

    expected_nodes = int(os.environ.get("EXPECTED_NODES", "1"))

    alive_nodes = [n for n in ray.nodes() if n["Alive"]]
    alive_count = len(alive_nodes)

    logging.info(f"Ray cluster status: {alive_count}/{expected_nodes} nodes alive.")

    if alive_count == expected_nodes:
        logging.info("Cluster is ready.")
        sys.exit(0)
    else:
        logging.info("Cluster is NOT ready.")
        sys.exit(1)
---
# Source: vllm-stack/templates/ray-cluster.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "distilgpt2-raycluster-vllm-start-script"
data:
  vllm-entrypoint.sh: |
    #!/bin/bash
    set -e

    echo "Waiting for Ray to become available..."
    until python3 /scripts/wait_for_ray.py; do
      echo "Ray not ready yet. Retrying in 2 seconds..."
      sleep 2
    done

    echo "Ray is ready. Starting vLLM..."

    # Start constructing command
    ARGS=(
      "vllm"
      "serve"
      ""distilbert/distilgpt2""
      "--host" "0.0.0.0"
      "--port" "8000"
      "--distributed-executor-backend" "ray"
    )
    ARGS+=("--tensor-parallel-size" "1")
    ARGS+=("--pipeline-parallel-size" "2")

    echo "Executing: ${ARGS[@]}"
    exec "${ARGS[@]}"
