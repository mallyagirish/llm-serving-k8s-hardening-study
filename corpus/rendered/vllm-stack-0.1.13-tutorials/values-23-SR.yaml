# Source: vllm-stack/templates/deployment-router.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-23-sr-deployment-router"
  namespace: llm-scan
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/instance: scan-23-sr
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: router
    release: router
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: router
      app.kubernetes.io/instance: scan-23-sr
      app.kubernetes.io/component: router
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: router
      release: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
        app.kubernetes.io/instance: scan-23-sr
        app.kubernetes.io/component: router
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: router
        release: router
    spec:
      serviceAccountName: scan-23-sr-router-service-account
      containers:
      - name: router-container
        image: "lmcache/lmstack-router:latest"
        imagePullPolicy: "Always"
        env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: LMCACHE_LOG_LEVEL
            value: "INFO"
        args:
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--service-discovery"
          - "k8s"
          - "--k8s-namespace"
          - "llm-scan"
          - "--k8s-service-discovery-type"
          - "pod-ip"
          - "--k8s-label-selector"
          - environment=test,release=test
          - "--routing-logic"
          - "roundrobin"
          - "--session-key"
          - "x-user-id"
          - "--engine-stats-interval"
          - "15"
          - "--request-stats-window"
          - "60"
        resources:
          limits:
            cpu: "1"
            memory: 2G
          requests:
            cpu: "1"
            memory: 2G
        ports:
          - name: "router-port"
            containerPort: 8000
          - name: "lmcache-port"
            containerPort: 9000
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: router-port
          initialDelaySeconds: 30
          periodSeconds: 5
        startupProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: router-port
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: router-port
          initialDelaySeconds: 30
          periodSeconds: 5
---
# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-23-sr-qwen3-deployment-vllm"
  namespace: llm-scan
  labels:
    model: qwen3
    helm-release-name: scan-23-sr
    app.kubernetes.io/name: qwen3
    app.kubernetes.io/instance: scan-23-sr
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      model: qwen3
      helm-release-name: scan-23-sr
      app.kubernetes.io/name: qwen3
      app.kubernetes.io/instance: scan-23-sr
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: qwen3
        helm-release-name: scan-23-sr
        app.kubernetes.io/name: qwen3
        app.kubernetes.io/instance: scan-23-sr
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostname: "scan-23-sr-qwen3-vllm-stack"
      subdomain: "scan-23-sr-qwen3-engine-service"
      containers:
        - name: "vllm"
          image: "lmcache/vllm-openai:v0.3.7"
          securityContext:
            runAsNonRoot: false
          command:
          - "/opt/venv/bin/vllm"
          - "serve"
          - "Qwen/Qwen3-8B"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--no-enable-prefix-caching"
          - "--served-model-name"
          - "Qwen/Qwen3-8B"
          - "qwen3"
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /data
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PROMETHEUS_MULTIPROC_DIR
            value: "/tmp"
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "16Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: scan-23-sr-storage
            mountPath: /data
      volumes:
        - name: scan-23-sr-storage
          persistentVolumeClaim:
            claimName: "scan-23-sr-qwen3-storage-claim"
