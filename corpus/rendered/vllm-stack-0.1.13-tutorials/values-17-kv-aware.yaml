# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-17-kv-aware-gpt-oss-20b-deployment-vllm"
  namespace: llm-scan
  labels:
    model: gpt-oss-20b
    helm-release-name: scan-values-17-kv-aware
    app.kubernetes.io/name: gpt-oss-20b
    app.kubernetes.io/instance: scan-values-17-kv-aware
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      model: gpt-oss-20b
      helm-release-name: scan-values-17-kv-aware
      app.kubernetes.io/name: gpt-oss-20b
      app.kubernetes.io/instance: scan-values-17-kv-aware
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: gpt-oss-20b
        helm-release-name: scan-values-17-kv-aware
        app.kubernetes.io/name: gpt-oss-20b
        app.kubernetes.io/instance: scan-values-17-kv-aware
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      hostname: "scan-values-17-kv-aware-gpt-oss-20b-vllm-stack"
      subdomain: "scan-values-17-kv-aware-gpt-oss-20b-engine-service"
      containers:
        - name: "vllm"
          image: "lmcache/vllm-openai:v0.3.9post2"
          securityContext:
            runAsNonRoot: false
          command:
          - "/opt/venv/bin/vllm"
          - "serve"
          - "openai/gpt-oss-20b"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--enable-prefix-caching"
          - "--max-model-len"
          - "8000"
          - "--gpu_memory_utilization"
          - "0.9"
          - "--kv-transfer-config"
          - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /data
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PROMETHEUS_MULTIPROC_DIR
            value: "/tmp"
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: HF_HOME
            value: /data
          - name: LMCACHE_USE_EXPERIMENTAL
            value: "True"
          - name: VLLM_RPC_TIMEOUT
            value: "1000000"
          - name: LMCACHE_LOG_LEVEL
            value: "DEBUG"
          - name: LMCACHE_LOCAL_CPU
            value: "True"
          - name: LMCACHE_MAX_LOCAL_CPU_SIZE
            value: "60"
          - name: LMCACHE_ENABLE_CONTROLLER
            value: "True"
          - name: LMCACHE_LMCACHE_INSTANCE_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: LMCACHE_CONTROLLER_PULL_URL
            value: "scan-values-17-kv-aware-router-service:9000"
          - name: LMCACHE_CONTROLLER_REPLY_URL
            value: "scan-values-17-kv-aware-router-service:9001"
          - name: LMCACHE_LMCACHE_WORKER_PORTS
            value: "8001"
          - name: LMCACHE_P2P_HOST
            value: "localhost"
          - name: LMCACHE_P2P_INIT_PORTS
            value: "30081"
          - name: LMCACHE_LMCACHE_WORKER_HEARTBEAT_TIME
            value: "30"
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "128Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: scan-values-17-kv-aware-storage
            mountPath: /data
      volumes:
        - name: scan-values-17-kv-aware-storage
          persistentVolumeClaim:
            claimName: "scan-values-17-kv-aware-gpt-oss-20b-storage-claim"
