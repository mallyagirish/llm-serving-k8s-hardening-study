# Source: vllm-stack/templates/deployment-lora-controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-values-09-lora-helm-lora-controller
  namespace: llm-scan
  labels:
    app.kubernetes.io/component: lora-controller
    helm-release-name: scan-values-09-lora-helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: lora-controller
      helm-release-name: scan-values-09-lora-helm
  template:
    metadata:
      labels:
        app.kubernetes.io/component: lora-controller
        helm-release-name: scan-values-09-lora-helm
    spec:
      serviceAccountName: scan-values-09-lora-helm-lora-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "lmcache/lmstack-lora-controller:latest"
          imagePullPolicy: Always
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure
          env:
            - name: WATCH_NAMESPACE
              value: llm-scan
            - name: KUBERNETES_CLUSTER_DOMAIN
              value: "cluster.local"
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
      volumes:
      terminationGracePeriodSeconds: 10
