# Source: vllm-stack/templates/deployment-cache-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-06-shared-storage-deployment-cache-server"
  namespace: llm-scan
  labels:
    app.kubernetes.io/name: cache-server
    app.kubernetes.io/instance: scan-values-06-shared-storage
    app.kubernetes.io/component: cache-server
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: cacheserver
    release: cacheserver
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cache-server
      app.kubernetes.io/instance: scan-values-06-shared-storage
      app.kubernetes.io/component: cache-server
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: cacheserver
      release: cacheserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-server
        app.kubernetes.io/instance: scan-values-06-shared-storage
        app.kubernetes.io/component: cache-server
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: cacheserver
        release: cacheserver
    spec:
      containers:
        - name: "lmcache-server"
          image: "lmcache/vllm-openai:latest"
          command:
          - "/opt/venv/bin/lmcache_server"
          - "0.0.0.0"
          - "8080"
          resources:
            limits:
              cpu: "4"
              memory: 10G
            requests:
              cpu: "4"
              memory: 8G
          ports:
            - name: "caserver-cport"
              containerPort: 8080
          imagePullPolicy: IfNotPresent
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
            exec:
              command:
              - "/opt/venv/bin/python3"
              - "/workspace/LMCache/examples/kubernetes/health_probe.py"
              - "127.0.0.1"
              - "8080"
