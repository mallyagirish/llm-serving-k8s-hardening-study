# Source: vllm-stack/templates/deployment-vllm-multi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "scan-values-06-shared-storage-mistral-deployment-vllm"
  namespace: llm-scan
  labels:
    model: mistral
    helm-release-name: scan-values-06-shared-storage
    app.kubernetes.io/name: mistral
    app.kubernetes.io/instance: scan-values-06-shared-storage
    app.kubernetes.io/component: serving-engine
    app.kubernetes.io/part-of: vllm-stack
    app.kubernetes.io/managed-by: helm
    environment: test
    release: test
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      model: mistral
      helm-release-name: scan-values-06-shared-storage
      app.kubernetes.io/name: mistral
      app.kubernetes.io/instance: scan-values-06-shared-storage
      app.kubernetes.io/component: serving-engine
      app.kubernetes.io/part-of: vllm-stack
      app.kubernetes.io/managed-by: helm
      environment: test
      release: test
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        model: mistral
        helm-release-name: scan-values-06-shared-storage
        app.kubernetes.io/name: mistral
        app.kubernetes.io/instance: scan-values-06-shared-storage
        app.kubernetes.io/component: serving-engine
        app.kubernetes.io/part-of: vllm-stack
        app.kubernetes.io/managed-by: helm
        environment: test
        release: test
    spec:
      initContainers:
        - name: wait-for-cache-server
          image: lmcache/vllm-openai:latest-nightly
          command: 
            - /bin/sh
            - -c
          args: 
            - |
              timeout 60 bash -c '
              while true; do
                /opt/venv/bin/python3 /workspace/LMCache/examples/kubernetes/health_probe.py $(RELEASE_NAME)-cache-server-service $(LMCACHE_SERVER_SERVICE_PORT) && exit 0
                echo "Waiting for LMCache server..."
                sleep 2
              done'
          env:
            - name: RELEASE_NAME
              value: scan-values-06-shared-storage
            - name: LMCACHE_SERVER_SERVICE_PORT
              value: "81"
          securityContext:
            runAsNonRoot: false
      hostname: "scan-values-06-shared-storage-mistral-vllm-stack"
      subdomain: "scan-values-06-shared-storage-mistral-engine-service"
      containers:
        - name: "vllm"
          image: "lmcache/vllm-openai:latest-nightly"
          securityContext:
            runAsNonRoot: false
          command:
          - "/opt/venv/bin/vllm"
          - "serve"
          - "mistralai/Mistral-7B-Instruct-v0.2"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--enable-prefix-caching"
          - "--max-model-len"
          - "16384"
          - "--kv-transfer-config"
          - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
          imagePullPolicy: "Always"
          env:
          - name: PYTHONHASHSEED
            value: "123"
          - name: HF_HOME
            value: /data
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PROMETHEUS_MULTIPROC_DIR
            value: "/tmp"
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: scan-values-06-shared-storage-secrets
                key: hf_token_mistral
          - name: LMCACHE_USE_EXPERIMENTAL
            value: "True"
          - name: VLLM_RPC_TIMEOUT
            value: "1000000"
          - name: LMCACHE_LOG_LEVEL
            value: "DEBUG"
          - name: LMCACHE_LOCAL_CPU
            value: "True"
          - name: LMCACHE_MAX_LOCAL_CPU_SIZE
            value: "20"
          - name: LMCACHE_REMOTE_URL
            value: "lm://scan-values-06-shared-storage-cache-server-service:81"
          - name: LMCACHE_REMOTE_SERDE
            value: "naive"
          - name: LMCACHE_LMCACHE_INSTANCE_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          ports:
            - name: "container-port"
              containerPort: 8000
            - name: zmq-port
              containerPort: 55555
            - name: ucx-port
              containerPort: 9999          
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
            httpGet:
              path:  /health
              port: 8000
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path:  /health
              port: 8000
          resources:
            requests:
              memory: "40Gi"
              cpu: "10"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: scan-values-06-shared-storage-storage
            mountPath: /data
      volumes:
        - name: scan-values-06-shared-storage-storage
          persistentVolumeClaim:
            claimName: "scan-values-06-shared-storage-mistral-storage-claim"
