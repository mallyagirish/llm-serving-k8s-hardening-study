# Source: ollama/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-ollama-1.18.0
  namespace: llm-scan
  labels:
    helm.sh/chart: ollama-1.18.0
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: scan-ollama-1.18.0
    app.kubernetes.io/version: "0.7.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy: 
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: scan-ollama-1.18.0
  template:
    metadata:
      labels:
        helm.sh/chart: ollama-1.18.0
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: scan-ollama-1.18.0
        app.kubernetes.io/version: "0.7.1"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: scan-ollama-1.18.0
      securityContext:
        {}
      containers:
        - name: ollama
          securityContext:
            {}
          image: "ollama/ollama:0.7.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          envFrom:
          args:
          resources:
            limits: {}
            requests: {}
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
      volumes:
        - name: ollama-data
          emptyDir: { }
---
