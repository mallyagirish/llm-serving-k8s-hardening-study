# Source: text-generation-inference/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-infra-text-generation-inference
  labels:
    helm.sh/chart: text-generation-inference-0.3.0
    app.kubernetes.io/name: text-generation-inference
    app.kubernetes.io/instance: scan-infra-text-generation-inference
    app.kubernetes.io/version: "3.3.7"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    {}
  selector:
    matchLabels:
      app.kubernetes.io/name: text-generation-inference
      app.kubernetes.io/instance: scan-infra-text-generation-inference
  template:
    metadata:
      labels:
        helm.sh/chart: text-generation-inference-0.3.0
        app.kubernetes.io/name: text-generation-inference
        app.kubernetes.io/instance: scan-infra-text-generation-inference
        app.kubernetes.io/version: "3.3.7"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: scan-infra-text-generation-inference
      securityContext:
        {}
      containers:
        - name: text-generation-inference
          securityContext:
            {}
          image: "ghcr.io/huggingface/text-generation-inference:3.3.7"
          imagePullPolicy: IfNotPresent
          command: [text-generation-launcher]
          env:
            - name: MODEL_ID
              value: "bigscience/bloom-560m"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 4
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            {}
