# Source: ollama/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-ollama-test-values
  namespace: llm-scan
  labels:
    helm.sh/chart: ollama-1.93.0
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: scan-ollama-test-values
    app.kubernetes.io/version: "0.40.12"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy: 
    type: Recreate
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: scan-ollama-test-values
  template:
    metadata:
      labels:
        helm.sh/chart: ollama-1.93.0
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: scan-ollama-test-values
        app.kubernetes.io/version: "0.40.12"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: scan-ollama-test-values
      terminationGracePeriodSeconds: 120
      securityContext:
        {}
      containers:
        - name: ollama
          securityContext:
            {}
          image: "ollama/ollama:0.40.12"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          envFrom:
          args:
          resources:
            limits: {}
            requests: {}
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    while ! /bin/ollama ps > /dev/null 2>&1; do
                      sleep 5
                    done

                    /bin/ollama pull  moondream

                    /bin/ollama run moondream
      volumes:
        - name: ollama-data
          emptyDir: { }
---
# Source: ollama/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "scan-ollama-test-values-test-connection"
  namespace: llm-scan
  labels:
    helm.sh/chart: ollama-1.93.0
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: scan-ollama-test-values
    app.kubernetes.io/version: "0.40.12"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-ec']
      args:
        - >
          wget -qO- "http://scan-ollama-test-values:11434" >/dev/null
  restartPolicy: Never
